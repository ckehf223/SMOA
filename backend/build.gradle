plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
}

group = 'com.smoa'
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

// 로깅은 Log4j2 단일 구현만 사용한다. Logback과 Boot 기본 로깅 스타터를 모든 configuration에서 제외한다.
configurations.configureEach {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    exclude group: 'ch.qos.logback', module: 'logback-classic'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'
    implementation 'org.apache.poi:poi-ooxml:5.4.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// frontend/(순수 HTML·CSS·JS)를 같은 JAR 의 static 으로 포장한다. 별도 npm 빌드 없음. 한 Spring Boot 프로세스·같은 출처로 제공된다.
// 루트에서 열든 backend 단독으로 열든 ../frontend 를 가리킨다.
tasks.named('processResources') {
    from("${projectDir}/../frontend") {
        into 'static'
    }
    // 기존 SMOA 웹 디자인을 Spring Boot 화면에서도 같은 원본에서 제공한다.
    from("${projectDir}/../public/assets") {
        include 'theme.css', 'theme.js', 'smoa-mark.png', 'navigation.css', 'dashboard.css'
        into 'static/assets/design'
    }
    from("${projectDir}/../server/legacy") {
        include 'clock.cjs', 'daily-area-report.cjs'
        rename(/(.*)\.cjs/, '$1.js')
        into 'static/assets/daily'
        filteringCharset = 'UTF-8'
        filter { line ->
            line.replace('const M = require("./model.cjs");', 'import * as M from "./model.js";')
                .replace('const { parseClock } = require("./clock.cjs");', 'import { parseClock } from "./clock.js";')
                .replace('module.exports =', 'export')
        }
    }
}

tasks.named('bootJar') {
    archiveBaseName = 'smoa-backend'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test') {
    useJUnitPlatform()
    defaultCharacterEncoding = 'UTF-8'
    maxParallelForks = 1
    // 개발자 셸의 실제 DB·부트스트랩 환경 변수가 테스트로 새지 않게 막는다.
    // DB 접속 값은 해석되지 않는 예약 도메인(.invalid)과 더미 값으로 고정한다. 테스트는 DB에 연결하지 않는다.
    environment 'SMOA_DB_HOST', 'db.invalid'
    environment 'SMOA_DB_PORT', '3306'
    environment 'SMOA_DB_NAME', 'contract_check_unused'
    environment 'SMOA_DB_USER', 'unused'
    environment 'SMOA_DB_PASSWORD', 'unused'
    environment 'SMOA_BOOTSTRAP_USERNAME', ''
    environment 'SMOA_BOOTSTRAP_PASSWORD', ''
    environment 'SMOA_BOOTSTRAP_ENABLED', 'false'
    environment 'SMOA_BOOTSTRAP_ENVIRONMENT', ''
    environment 'SMOA_LIBRARY_ID', ''
    environment 'SMOA_CONTACT_KEY_FILE', ''
}
