# SMOA backend 공통 설정. 비밀 값은 두지 않는다(환경 변수 참조만).
# 저장소 프로파일(local-memory | local | prod)은 반드시 하나를 명시해야 한다. 미지정이면 기동 실패.
spring:
  application:
    name: smoa-backend
  main:
    banner-mode: off
  jackson:
    default-property-inclusion: non_null
    mapper:
      accept-case-insensitive-enums: true   # 동작 목록(read/write/export)을 소문자로 받는다
    deserialization:
      # 계정 수정 등 요청 필드 허용 목록: 정의되지 않은 필드가 오면 400
      fail-on-unknown-properties: true
  sql:
    init:
      mode: never   # 스키마 자동 생성·초기화 금지

server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 30m          # 유휴 만료
      tracking-modes: cookie
      cookie:
        name: SMOASESSION
        http-only: true
        secure: true        # local-memory(HTTP)에서만 false로 덮어쓴다
        same-site: lax
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

logging:
  config: classpath:log4j2.xml

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    # MyBatis 자체 SQL 출력은 끈다. SQL 로그는 local 프로파일의 log4jdbc(jdbc.sqltiming)만 사용한다.
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: false
    # 값이 null 인 파라미터 바인딩은 JDBC NULL 로 보낸다(MariaDB 드라이버 호환).
    jdbc-type-for-null: 'NULL'
    # SQL 원문의 앞뒤 공백·연속 빈 줄을 MyBatis 가 줄이지 않게 한다(log4jdbc 와 함께 원본 SQL 출력 확인용)
    shrink-whitespaces-in-sql: false

smoa:
  security:
    bcrypt-strength: 12
    login-max-failures: 5          # 계정키+IP 기준. IP 단독 기준은 6배
    login-window: 15m
    login-lockout: 15m
    login-tracker-max-entries: 10000
    # 로그인 전에 공개할 정적 파일(GET)의 Ant 패턴. 여기에 없는 경로는 모두 거부된다.
    # 정적 자원(HTML 껍데기·CSS·JS)만 공개한다. 사용자 자료는 모두 /api 를 거치며 /api/** 와 /pages/** 는 지정할 수 없다.
    public-paths: ["/", "/index.html", "/login.html", "/favicon.ico", "/assets/**"]

  bootstrap:
    # DB 모드(local/prod) 최초 총관리자 초기화는 기본 비활성이다. enabled=true 와 environment(활성 프로파일과 같은 값)를 모두 명시해야 한다.
    # USERMSTR 이 비어 있을 때만 1회 동작하며 기존 계정·명부·대상자는 절대 바꾸지 않는다. 값은 환경 변수로만 받는다.
    enabled: ${SMOA_BOOTSTRAP_ENABLED:false}
    environment: ${SMOA_BOOTSTRAP_ENVIRONMENT:}
    username: ${SMOA_BOOTSTRAP_USERNAME:}
    password: ${SMOA_BOOTSTRAP_PASSWORD:}
  storage:
    # 업무 자료실 ID(LIBMSTR.LIB_ID). local/prod 에서 필수이며 자동 선택하지 않는다.
    library-id: ${SMOA_LIBRARY_ID:}
  contact:
    # 연락처 암호화 키 파일 경로(정확히 32바이트). 파일 내용은 로그·응답·DB 에 남기지 않는다.
    key-file: ${SMOA_CONTACT_KEY_FILE:}

  # 기본 프로그램 정의. local-memory 에서는 가상 저장소 시드, local/prod 에서는 smoa.bootstrap 이 명시적으로 켜진 최초 1회에만
  # PGMMSTR 에 없는 항목을 채우는 목록이다. 프로그램 ID 는 불변 키이며 이름·그룹·순서·경로·동작은 총관리자 화면에서 바꾼다.
