<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>SMOA</title>
  <link rel="icon" href="/assets/design/smoa-mark.png">
  <link rel="stylesheet" href="/assets/design/theme.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="stylesheet" href="/assets/design/navigation.css">
  <link rel="stylesheet" href="/assets/design/dashboard.css">
  <link rel="stylesheet" href="/assets/css/desktop-details.css">
  <link rel="stylesheet" href="/assets/css/workspace-layout.css">
  <script src="/assets/design/theme.js"></script>
</head>
<body class="shell-body">
  <div class="shell">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <img src="/assets/design/smoa-mark.png" class="brand-mark" alt="" width="36" height="36">
        <div><strong class="brand-name">SMOA</strong><div class="brand-sub">업무 화면</div></div>
      </div>
      <nav id="nav" class="sidenav" aria-label="업무 메뉴"></nav>
      <div class="sidebar-bottom">
        <div class="operator">
          <span class="avatar" id="avatar" aria-hidden="true"></span>
          <div class="operator-text"><strong id="who"></strong><small id="permission-package"></small></div>
        </div>
        <button id="logout" class="btn small" type="button">로그아웃</button>
      </div>
    </aside>
    <button id="nav-backdrop" class="nav-backdrop" type="button" aria-label="메뉴 닫기" hidden></button>
    <div class="workarea">
      <header class="topbar">
        <div class="breadcrumb" aria-label="현재 위치">
          <button id="nav-toggle" class="btn small nav-toggle" type="button" aria-controls="sidebar" aria-expanded="false">메뉴</button>
          <span id="crumb-group" hidden></span><span id="crumb-separator" aria-hidden="true" hidden>/</span><strong id="crumb"></strong>
        </div>
        <span id="dev-badge" class="badge warn" hidden>가상 자료 모드</span>
        <div class="top-status" data-display-controls></div>
      </header>
      <main id="main" class="main" tabindex="-1"><p class="muted">불러오는 중…</p></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/assets/js/shell.js"></script>
</body>
</html>
